[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chartqa-multimodal-assistant"
version = "0.1.0"
description = "Assistant Multimodal de Raisonnement sur Graphiques (ChartQA)"
authors = [{ name = "GrapheinAI Team" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -v"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']
