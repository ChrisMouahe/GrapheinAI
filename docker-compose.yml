version: '3.8'

services:
  graphein-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphein-api-server
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      - PORT=8088
      - HOST=0.0.0.0
    volumes:
      - graphein-data:/app/data
      - graphein-logs:/app/logs
      - graphein-backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  graphein-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphein-streamlit-app
    command: ["streamlit", "run", "src/app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - graphein-data:/app/data
      - graphein-logs:/app/logs
    restart: unless-stopped
    depends_on:
      graphein-api:
        condition: service_healthy

volumes:
  graphein-data:
    driver: local
  graphein-logs:
    driver: local
  graphein-backups:
    driver: local
